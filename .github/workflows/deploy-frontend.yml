name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'smart-monitoring-ui/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  AWS_REGION:              ${{ vars.AWS_REGION }}
  S3_BUCKET:               ${{ vars.S3_BUCKET }}               # e.g. smart-monitoring-ui
  CLOUDFRONT_DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION }} # e.g. E1ABCDEF123456

jobs:
  build-and-deploy:
    name: Build → S3 → CloudFront
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node 20 ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-monitoring-ui/package.json

      # ── 3. Install & build ──────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: smart-monitoring-ui
        run: npm ci

      - name: Build React app
        working-directory: smart-monitoring-ui
        env:
          # Production API base URL — Vite replaces this at build time
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      # ── 4. Configure AWS credentials ────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 5. Sync to S3 ───────────────────────────────────────────────────────
      - name: Deploy to S3
        run: |
          aws s3 sync smart-monitoring-ui/dist/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          # index.html must never be cached — browser must always fetch fresh
          aws s3 cp smart-monitoring-ui/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      # ── 6. Invalidate CloudFront cache ──────────────────────────────────────
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION }} \
            --paths "/*"
